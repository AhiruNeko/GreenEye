<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenEye - Login</title>
    <link rel="stylesheet" href="login.css">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">Green Eye</a> - Supporting Local Organic Food
        </div>
    </nav>
</head>
<body>
<div class="relative-container">
    <img src="../assets/login/bg.png">

    <div class="login-container">
        <div class="logo">
            <h1>🌱GreenEye</h1>
            <p>Welcome back!</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <button type="submit" class="google-login-btn" id="GoogleLoginBtn">
            <img src="../assets/login/google.svg" class="google-icon">
            <label class="google-login-label">Log in with Google</label>
        </button>

        <button type="submit" class="apple-login-btn" id="AppleLoginBtn">
            <img src="../assets/login/apple.svg" class="apple-icon">
            <label class="apple-login-label">Log in with Apple</label>
        </button>

        <div class="guest-option">
            <p class="option-label">Or continue as guest</p>
        </div>

        <hr class="divider">

        <button type="button" class="guest-btn" id="guestBtn">
            Continue as Guest
        </button>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://lcpbgtfrwxtagaefbusl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcGJndGZyd3h0YWdhZWZidXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwNzA0MjUsImV4cCI6MjA3NzY0NjQyNX0.73gt5IJ3aOh1WStLZK77-MNk_coAbUQpB13COz3CFcQ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const googleLogin = document.getElementById("GoogleLoginBtn");
    const appleLogin = document.getElementById("AppleLoginBtn");
    const guestBtn = document.getElementById("guestBtn");

    googleLogin.addEventListener('click', async () => {
        const { data, error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: replaceLastPathSegment("user-join.html") }
        });
        if (error) console.error('Google login error:', error);
    });

    appleLogin.addEventListener('click', async () => {
        const { data, error } = await supabase.auth.signInWithOAuth({
            provider: 'apple',
            options: { redirectTo: window.location.origin + '/user-join.html' }
        });
        if (error) console.error('Apple login error:', error);
    });

    function continueAsGuest() {
        supabase.auth.signOut();
        localStorage.removeItem('userId');
        localStorage.removeItem('userName');
        localStorage.removeItem('userEmail');
        sessionStorage.clear();
        window.location.href = 'guest-join.html';
    }
    guestBtn.addEventListener("click", continueAsGuest);

    // 页面加载时检查是否已登录
    window.addEventListener('load', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            const user = session.user;
            localStorage.setItem('userId', user.id);
            localStorage.setItem('userName', user.user_metadata.full_name || user.email);
            localStorage.setItem('userEmail', user.email);

            // 你自己的提示函数
            showSuccess('You are already logged in. Redirecting...');
            setTimeout(() => {
                window.location.href = 'user-join.html';
            }, 1000);
        }
    });

    function replaceLastPathSegment(newSegment, url = window.location.href) {
        const urlObj = new URL(url);
        const segments = urlObj.pathname.split('/');
        if (segments.length > 0) {
            segments[segments.length - 1] = newSegment;
        } else {
            segments.push(newSegment);
        }
        urlObj.pathname = segments.join('/');
        return urlObj.toString();
    }

</script>

</body>
</html>
