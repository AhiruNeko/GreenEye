<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenEye - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="relative-container">
    <img src="../assets/login/bg.png">

    <div class="login-container">
        <div class="logo">
            <h1>🌱GreenEye</h1>
            <p>Welcome back!</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required
                       placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter your password">
            </div>
        </form>

        <button type="submit" class="login-btn" id="loginBtn">
            Sign In
        </button>

        <div class="register-link">
            Don't have an account? <a href="register.html">Create one here.</a>
        </div>

        <div class="guest-option">
            <p class="option-label">Or continue as guest</p>
        </div>

        <hr class="divider">

        <button type="button" class="guest-btn" onclick="continueAsGuest()">
            Continue as Guest
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<script src="../Backend/login.js"></script>
</body>
</html>
