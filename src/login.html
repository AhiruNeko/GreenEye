<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenEye - Login</title>
    <link rel="stylesheet" href="css/login.css">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">Green Eye</a> - Supporting Local Organic Food
        </div>
    </nav>
</head>
<body>
<div class="relative-container">
    <img src="assets/login/bg.png">

    <div class="login-container">
        <div class="logo">
            <h1>🌱GreenEye</h1>
            <p>Welcome back!</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <button type="submit" class="google-login-btn" id="GoogleLoginBtn">
            <img src="assets/login/google.svg" class="google-icon">
            <label class="google-login-label">Log in with Google</label>
        </button>

        <button type="submit" class="github-login-btn" id="GithubLoginBtn">
            <img src="assets/login/github.svg" class="github-icon">
            <label class="github-login-label">Log in with Github</label>
        </button>

        <div class="guest-option">
            <p class="option-label">Or continue as guest</p>
        </div>

        <hr class="divider">

        <button type="button" class="guest-btn" id="guestBtn">
            Continue as Guest
        </button>
    </div>
</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
