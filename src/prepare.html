<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepare Page</title>
    <link rel="stylesheet" href="css/prepare.css">
</head>
<body>

<div id="loadingOverlay" class="loading-overlay" style="display: block;">
    <div id="waitLabel">Please wait...</div>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>
</div>

<div id="bgContainer" class="background-container" style="display: none;">
    <img src="assets/prepare/prepare.png" class="background-image" id="backgroundImage">

    <div class="label hello-label">Hello👋,</div>
    <div class="label name-label" id="userName">User!</div>

    <div class="preview-container" id="previewContainer">
        <span id="previewHint">No Image</span>
        <img id="previewImage" src="" alt="Preview">
    </div>
    <div id="selectContainer" class="select-container">
        <div class="food-label">Your local organic food is</div>
        <input list="foods" id="foodSelect" class="select-food" placeholder="Enter your food">
        <datalist id="foods">
            <option value="Bean">
            <option value="Bitter Gourd">
            <option value="Bottle Gourd">
            <option value="Brinjal">
            <option value="Broccoli">
            <option value="Cabbage">
            <option value="Capsicum">
            <option value="Carrot">
            <option value="Cauliflower">
            <option value="Cucumber">
            <option value="Papaya">
            <option value="Potato">
            <option value="Pumpkin">
            <option value="Radish">
            <option value="Tomato">
        </datalist>
    </div>

    <button class="generate-btn" id="generateBtn">Generate Report</button>
</div>


<script src="js/prepare.js"></script>
</body>
</html>
