<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepare Page</title>
    <link rel="stylesheet" href="css/prepare.css">
</head>
<body>

<div id="loadingOverlay" class="loading-overlay" style="display: block;">
    <div id="waitLabel">Please wait...</div>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>
</div>

<div id="bgContainer" class="background-container" style="display: none;">
    <img src="/src/assets/prepare/prepare.png" class="background-image" id="backgroundImage">

    <div class="label hello-label">Hello👋,</div>
    <div class="label name-label" id="userName">User!</div>

    <div class="preview-container" id="previewContainer">
        <span id="previewHint">No Image</span>
        <img id="previewImage" src="" alt="Preview">
    </div>
    <div id="selectContainer" class="select-container">
        <div class="food-label">Your local organic food is</div>
        <select id="foodSelect" class="select-food">
            <option value="bean">Bean</option>
            <option value="bitter_gourd">Bitter Gourd</option>
            <option value="bottle_gourd">Bottle Gourd</option>
            <option value="brinjal">Brinjal</option>
            <option value="broccoli">Broccoli</option>
            <option value="cabbage">Cabbage</option>
            <option value="capsicum">Capsicum</option>
            <option value="carrot">Carrot</option>
            <option value="cauliflower">Cauliflower</option>
            <option value="cucumber">Cucumber</option>
            <option value="papaya">Papaya</option>
            <option value="potato">Potato</option>
            <option value="pumpkin">Pumpkin</option>
            <option value="radish">Radish</option>
            <option value="tomato">Tomato</option>
        </select>
    </div>

    <button class="generate-btn" id="generateBtn">Generate Report</button>
</div>


<script src="js/prepare.js"></script>
</body>
</html>
