<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Eye</title>
    <link rel="stylesheet" href="css/index.css">

    <nav class="navbar">
        <div class="logo">
            <a href="index.html">Green Eye</a> - Supporting Local Organic Food
        </div>
        <button class="log-in-button" id="logInBtn">Log in</button>
    </nav>

</head>
<body>

<div class="relative-container">
    <img src="assets/home/home.png" alt="Home Image">
    <div class="absolute-label chemical-data" id="chemicalData"></div>
    <div class="absolute-label chemical-text">of chemical pesticide residues reduction.</div>

    <div class="absolute-label carbon-data" id="carbonData"></div>
    <div class="absolute-label carbon-text">of carbon emission reduction, equivalent to planting 2 trees.</div>

    <div class="absolute-label water-data" id="waterData"></div>
    <div class="absolute-label water-text">of precious clean water has been saved.</div>

    <div class="absolute-label soil-data" id="soilData"></div>
    <div class="absolute-label soil-text">of healthy soil has been protected, and been full of vitality.</div>
</div>

<div class="join-container">
    <img src="assets/home/join%20us%20with%20text.png" alt="Join Us">
    <div class="panel">
        <label class="contribution-label">Add your contribution here</label>
        <button class="contribution-button" id="contributionBtn">Add contribution</button>
        <div class="divider">
            <span>OR</span>
        </div>
        <label class="learn-more-label">Learn more about Green Eye</label>
        <button type="button" class="learn-more-btn" id="learnMoreBtn">Learn more</button>
    </div>
</div>

<script src="js/index.js" type="module"></script>
</body>
</html>
